[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmgm-c4"
version = "1.0.0"
description = "Standalone original C4, matched Deep V3 baselines and C4 ablations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmgm-c4 = "cmgm_c4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
